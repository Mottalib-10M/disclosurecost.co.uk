# Monthly refresh of the official data (Crown copyright, Open Government Licence v3.0):
# DBS fees read from GOV.UK and legislation.gov.uk (SI 2026/985), DBS dataset 1 (quarterly .xlsx,
# turnaround by level and Update Service subscribers), and the update dates of the six DBS eligibility guides.
# Disclosure Scotland and AccessNI fees have no API: the script checks that their pages still show
# the amounts in src/data/fees.json and fails otherwise (an e-mail alert, never a silent change).
# AccessNI weekly turnaround times (week and average days) are read from the nidirect table.
# The DBS police performance report (PDF, monthly) is read by hand into src/data/police-performance.json.
# Rebuild and tests run before anything is committed; a commit happens only if the data changed.
name: Update official DBS data
on:
  schedule:
    - cron: '0 6 6 * *'    # 6th of each month, 06:00 UTC
    - cron: '0 6 21 * *'   # 21st, in case a quarterly dataset comes out late
    - cron: '0 7 * * 2'    # every Tuesday: AccessNI weekly turnaround times on nidirect
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - run: python3 scripts/update-data.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --legacy-peer-deps
      - run: npm run build && npx vitest run
      - name: Commit if the data changed
        run: |
          git config user.name 'Radif Partners'
          git config user.email 'amradif@gmail.com'
          git add src/data
          git diff --cached --quiet || (git commit -m 'Données : barèmes DBS, délais et guides d’éligibilité' && git push)
